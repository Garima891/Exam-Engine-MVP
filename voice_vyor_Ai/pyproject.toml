[project]
name = "voice-vyor-ai"
version = "0.1.0"
description = "Second Voice Detection with Background Noise Filtering"
readme = "readme.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepfilternet>=0.5.6",
    "librosa>=0.11.0",
    "numpy>=1.26,<2.0",
    "scipy==1.15.3",
    "setuptools<81",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "speechbrain>=1.1.2",
    "tensorflow==2.16.2",
    "tensorflow-hub==0.16.1",
    "tensorflow-intel==2.16.2",
    "tf-keras==2.16.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
